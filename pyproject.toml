[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pickinsta"
version = "1.0.0"
description = "Instagram image selection pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Renato Bonomini" }]
dependencies = [
  "Pillow>=12.2.0",
  "opencv-python-headless>=4.13.0.92",
  "numpy>=2.4.6",
  "ImageHash>=4.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.0", "ruff>=0.15.17", "pre-commit>=4.6.0"]
clip = ["transformers>=5.12.0", "torch>=2.12.0"]
claude = ["anthropic>=0.109.1", "tqdm>=4.68.2"]
yolo = ["ultralytics>=8.4.67"]

[project.scripts]
pickinsta = "pickinsta.ig_image_selector:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
