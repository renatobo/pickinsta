[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pickinsta"
version = "1.2.0"
description = "Instagram image selection pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Renato Bonomini" }]
dependencies = [
  "Pillow>=11.0.0",
  "opencv-python-headless>=4.11.0",
  "numpy>=2.1.0",
  "ImageHash>=4.3.2",
  "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.13.0", "pre-commit>=4.0.0"]
clip = ["transformers>=5.0.0", "torch>=2.4.0"]
claude = ["anthropic>=0.69.0"]
yolo = ["ultralytics>=8.3.0"]

[project.scripts]
pickinsta = "pickinsta.ig_image_selector:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
