[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pickinsta"
version = "1.3.0"
description = "Instagram image selection pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Renato Bonomini" }]
dependencies = [
  "Pillow>=12.3.0",
  "opencv-python-headless>=5.0.0.93",
  "numpy>=2.5.3",
  "ImageHash>=4.3.2",
  "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.8",
  "pre-commit>=4.6.2",
]
clip = ["transformers>=5.17.0", "torch>=2.13.0"]
claude = ["anthropic>=0.120.0"]
yolo = ["ultralytics>=8.4.100"]

[project.scripts]
pickinsta = "pickinsta.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_integration: opt-in compatibility probes for real external services or local models",
  "anthropic_integration: makes a paid Anthropic API request when explicitly enabled",
  "ollama_integration: calls an explicitly configured local Ollama server",
  "clip_integration: loads and runs the real CLIP model when model downloads are explicitly allowed",
  "yolo_integration: loads and runs an explicitly configured local YOLO model",
]

[tool.coverage.run]
branch = true
source = ["pickinsta"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "B"]
ignore = ["B905"]
