name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        run: make lint

      - name: Test
        if: matrix.python-version != '3.14'
        run: make test

      - name: Test with coverage
        if: matrix.python-version == '3.14'
        run: python -m pytest --cov=pickinsta --cov-report=term-missing

      - name: Check offline performance invariants
        if: matrix.python-version == '3.14'
        run: |
          python tests/benchmarks/offline_stage_benchmark.py \
            --repetitions 3 --images 4 \
            --check --max-cached-to-warm-ratio 0.75 \
            --output "${RUNNER_TEMP}/pickinsta-offline-benchmark.json"

      - name: Build package
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Smoke test wheel
        run: |
          python -m venv "${RUNNER_TEMP}/pickinsta-wheel-smoke"
          "${RUNNER_TEMP}/pickinsta-wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/pickinsta-wheel-smoke/bin/python" -c "import pickinsta"
